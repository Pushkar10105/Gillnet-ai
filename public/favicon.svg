<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded dark background badge -->
  <rect width="64" height="64" rx="16" fill="#000000" stroke="#F3F3E3" stroke-width="2" />
  
  <!-- Cyber Security Shield -->
  <path d="M32 10L48 16V29C48 39.5 41.2 49 32 54C22.8 49 16 39.5 16 29V16L32 10Z" 
        fill="#0D1117" 
        stroke="#82E437" 
        stroke-width="2.5" 
        stroke-linejoin="round" />
  
  <!-- AI Neural Net / Mesh Grid Inside Shield -->
  <g stroke="#82E437" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <!-- Horizontal lattice lines -->
    <line x1="24" y1="22" x2="40" y2="22" />
    <line x1="21" y1="30" x2="43" y2="30" />
    <line x1="25" y1="38" x2="39" y2="38" />
    <!-- Vertical / diagonal neural connections -->
    <line x1="24" y1="22" x2="32" y2="30" />
    <line x1="40" y1="22" x2="32" y2="30" />
    <line x1="32" y1="30" x2="25" y2="38" />
    <line x1="32" y1="30" x2="39" y2="38" />
    <line x1="32" y1="30" x2="32" y2="46" />
  </g>

  <!-- Neural Nodes (Glowing dots) -->
  <circle cx="32" cy="22" r="2" fill="#F3F3E3" />
  <circle cx="24" cy="22" r="1.5" fill="#82E437" />
  <circle cx="40" cy="22" r="1.5" fill="#82E437" />
  
  <circle cx="32" cy="30" r="3" fill="#82E437" />
  <circle cx="21" cy="30" r="1.8" fill="#F3F3E3" />
  <circle cx="43" cy="30" r="1.8" fill="#F3F3E3" />
  
  <circle cx="25" cy="38" r="1.8" fill="#82E437" />
  <circle cx="39" cy="38" r="1.8" fill="#82E437" />
  <circle cx="32" cy="46" r="2.2" fill="#F3F3E3" />
</svg>